<div class="denbi-quick">
  <div class="denbi-quick__inner md-grid">
    <a class="denbi-quick__back" href="{{ config.extra.website_url }}"><span aria-hidden="true">←</span> <span class="denbi-quick__back-site">de.NBI Cloud </span>website</a>
    <span class="denbi-quick__label" id="denbi-quick-label">Quick access</span>
    <nav aria-labelledby="denbi-quick-label">
      <ul class="denbi-quick__list">
        {% for link in config.extra.quick_links %}
        <li>
          <a class="denbi-quick__link" href="{{ link.url or (nav.homepage.url | url) }}"{% if link.current %} aria-current="true"{% endif %}>
            <span class="denbi-quick__icon" aria-hidden="true">{% include ".icons/symbols/" ~ link.icon ~ ".svg" %}</span>
            <span class="denbi-quick__text">{{ link.label }}</span>
            {%- if link.badge %}
            <img class="denbi-quick__badge" src="{{ link.badge }}" alt="" height="20">
            {%- endif %}
          </a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</div>
