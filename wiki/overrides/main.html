 {% extends "base.html" %}

  {% block libs %}
    {{ super() }}
    <script src="{{ 'assets/javascripts/mermaid-theme.js' | url }}"></script>
  {% endblock %}

  {% block footer %}
    {{ super() }}
    <footer class="md-footer">
      <div class="md-footer-links md-footer-meta md-typeset">
        <div class="md-grid">
            <div style="margin: auto; text-align: center; padding: 2rem;">
            {% for link in config.extra.footer_links %}
            <a href="{{ link.href }}" 
            {%if link.new_tab | default(true) %}rel="noopener noreferrer" target="_blank"{% endif %}>{{ link.name }}</a>
            {% if not loop.last %} | {% endif %}
            {% endfor %}
            </div>
        </div>
      </div>
    </footer>
  {% endblock %}
