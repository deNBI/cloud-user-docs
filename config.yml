site_name: "de.NBI Cloud Wiki"
docs_dir: /srv_root/docs/wiki
site_dir: /var/www/html/wiki
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  custom_dir: wiki/overrides

  logo: 'assets/images/denbi-logo-color.svg'
  favicon: 'img/denbi.svg'
  features:
    - navigation.top
    - navigation.indexes
    - navigation.tabs
repo_name: 'deNBI/cloud-user-docs'
repo_url: 'https://github.com/deNBI/cloud-user-docs'
edit_uri: edit/dev/wiki/
use_directory_urls: true
# The theme overrides live inside docs_dir; don't publish the raw templates.
exclude_docs: |
  /overrides/
site_url: !ENV [ SITE_URL, 'https://cloud.denbi.de/wiki/' ]

plugins:
  - search
  - glightbox
  - macros
  - git-revision-date-localized:
      fallback_to_build_date: true
  - htmlproofer:
      enabled: !ENV [ ENABLED_HTMLPROOFER,False ]
      raise_error_after_finish: True
      retry_max_times: 3
      raise_error_excludes:
        -1: [ "https://cloud.denbi.de/portal/webapp/#/userinfo", "http://169.254.169.254", "https://signup.aai.lifescience-ri.eu/fed/registrar/?vo=lifescience", "https://login.elixir-czech.org/oidc/", "https://spreg-legacy.aai.elixir-czech.org/spreg/auth/facilities/myServices","http://BIBIGRID_MASTER/ganglia", "https://bastion-prod(dot)denbi(dot)cloud(dot)embl(dot)de" ]
        400: [ "http://169.254.169.254" ]
        403: [ "https://s3.denbi.uni-tuebingen.de","https://www.netapp.com/trident/","https://cloud-init.io", "https://linux.die.net/man/5/nfs", "https://geant.org/Services/", "https://www.netapp.com/trident/ " ]
        404: ["https://cloud.denbi.de/about/credits-calculator/"]
        429: [ "https://docs.ansible.com" ]
        500: [ "https://cloud.denbi.de/register", "https://signup.aai.lifescience-ri.eu/fed/registrar/?vo=elixir_test" ]
        503: [ "https://s3.denbi.uni-tuebingen.de" ]
        504: [ "https://denbi.cloud.embl.de", "https://cloud.denbi.de/about/credits-calculator/", "https://packages.ubuntu.com/","https://denbi-cloud.bihealth.org","http://apt-cache.bi.denbi.de:9999","http://129.70.51.2:9999","https://cloud.denbi.dkfz-heidelberg.de","https://denbi-cloud.bioquant.uni-heidelberg.de","https://denbi-cloud.bioquant.uni-heidelberg.de", "https://docs.kubermatic.com" ]
      ignore_urls:
        - "https://services.aai.lifescience-ri.eu/spreg/auth/facilities/myServices"
        - "https://spreg-legacy.aai.elixir-czech.org/spreg/auth/requests/new"
        # Ignore everything in the MathJax assets folder (includes CONTRIBUTING.md)
        - ".*assets/mathjax/.*"
        - ".*wiki/assets/mathjax/.*"
        # URLs blocked by bot protection (e.g. Cloudflare challenge)
        - "https://stackoverflow.com/questions/41137494/ha-proxy-rule-404-not-found"
        # Ansible docs frequently return 429 (Too Many Requests)
        - "https://docs.ansible.com/ansible/latest/user_guide/playbooks_reuse_roles.html"
        - "https://docs.ansible.com/ansible/2.9/modules/modules_by_category.html"
        - "https://docs.ansible.com/ansible/latest/user_guide/playbooks.html"
        - "https://docs.ansible.com/ansible/latest/getting_started/index.html"
      ignore_pages:
       - assets/mathjax/CONTRIBUTING.md

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path: !relative $config_dir
      check_paths: True
      auto_append:
        - wiki/includes/glossary.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - !ENV [ MATOMO_SCRIPT_FILE, matomo.js]
  - mathjax.js
  - assets/mathjax/tex-mml-chtml-mathjax-stix2.js


extra_css:
  - assets/css/fonts.css
  - assets/css/denbi.css
  - assets/css/chrome.css

extra:
  # Header links, copied by hand from the website's Wagtail site chrome.
  website_url: https://cloud.denbi.de/
  apply: { label: "Apply for a project", short_label: "Apply", url: "https://cloud.denbi.de/register/" }
  # icon: file in wiki/overrides/.icons/symbols/ without .svg; url "" is the wiki home;
  # badge: live image shown after the label (Uptime Kuma status-page badge, same
  # colours as the website, which keep 4.5:1 contrast to the badge's white text)
  quick_links:
    - { label: "Portal login", url: "https://cloud.denbi.de/portal/", icon: login }
    - { label: "Wiki", url: "", icon: menu_book, current: true }
    - { label: "Status", url: "https://status.cloud.denbi.de/", icon: dns,
        badge: "https://status.cloud.denbi.de/api/status-page/default/badge?style=flat-square&upColor=2e7d32&downColor=c62828&partialColor=b45309&maintenanceColor=5f6368" }
    - { label: "Facility news", url: "https://cloud.denbi.de/news/facility-news/", icon: campaign }
    - { label: "Support", url: "https://cloud.denbi.de/support/", icon: support_agent }
  consent:
    title: Cookie consent
    description: >-
      We use analytics cookies (Matomo) to understand how visitors use the wiki
      so we can improve it. With your consent, you help us make the documentation
      better. You can withdraw consent at any time.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics:
        name: Matomo
        checked: true
  # Footer, copied by hand from the website's Wagtail site chrome (trimmed for the wiki).
  footer_brand_text: 'Part of de.NBI (say "DEN-bee"), the German Network for Bioinformatics Infrastructure and ELIXIR Germany.'
  footer_logo_groups:  # paths under wiki/; dark: dark-mode variant; panel: light panel in dark mode; height in px (default 48)
    - heading: "Funded by"
      logos:
        - { name: "Federal Ministry of Research, Technology and Space (BMFTR)", light: assets/images/partners/bmftr-en.png, panel: true, height: 80 }
        - { name: "Funded by the European Union – NextGenerationEU", light: assets/images/partners/eu-nextgenerationeu-en.png, dark: assets/images/partners/eu-nextgenerationeu-en-neg.png }
    - heading: "In collaboration with"
      logos:
        - { name: "ELIXIR", href: "https://elixir-europe.org/", light: assets/images/partners/elixir-standard.svg, dark: assets/images/partners/elixir-negative-orange.svg }
        - { name: "LS Login", href: "https://www.lifescience-ri.eu/life-science-login/", light: assets/images/partners/ls-login.png, height: 36 }
  footer_columns:
    - heading: "Use"
      links:
        - { label: "Support", url: "https://cloud.denbi.de/support/" }
        - { label: "SimpleVM wiki", url: "https://simplevm.denbi.de/wiki/" }  # keep equal to simplevm_wiki_link
        - { label: "Training material (de.KCD)", url: "https://datenkompetenz.cloud/training/" }
    - heading: "de.NBI Cloud"
      links:
        - { label: "Website home", url: "https://cloud.denbi.de/" }
        - { label: "Apply for a project", url: "https://cloud.denbi.de/register/" }
        - { label: "Portal login", url: "https://cloud.denbi.de/portal/" }
        - { label: "Service status", url: "https://status.cloud.denbi.de/" }
    - heading: "Legal"
      links:
        - { label: "Terms of use", url: "https://cloud.denbi.de/about/policies/" }
        - { label: "Imprint", url: "https://cloud.denbi.de/about/imprint/" }
        - { label: "Cookie settings", url: "#__consent" }
  footer_legal_links:
    - { label: "de.NBI", url: "https://www.denbi.de/" }
    - { label: "GitHub", url: "https://github.com/deNBI" }

  simplevm_wiki_link: !ENV [ SIMPLE_VM_WIKI_LINK, 'https://simplevm.denbi.de/wiki/' ]

